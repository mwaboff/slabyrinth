# electron-builder configuration (architecture §7.4).
# The app is fully bundled by electron-vite into out/**; every npm dependency is a devDependency,
# so no node_modules are packaged and no native rebuild is needed.
appId: app.slabyrinth.desktop
productName: Slabyrinth
copyright: Copyright (c) 2026 Michael Aboff
directories:
  output: release
  buildResources: build
files:
  - "out/**"
  - "package.json"
# No extraResources: the curated palettes and orientation are compiled into the bundle (core
# palette/bundled.ts); user overrides live in userData/palettes. The full asset catalog never ships.
# The licences of the bundled fonts and npm packages (scripts/third-party-notices.ts) sit next to the
# executable, beside Electron's LICENSE.electron.txt and LICENSES.chromium.html (also in the AppImage).
extraFiles:
  - from: third-party/THIRD-PARTY-NOTICES.txt
    to: THIRD-PARTY-NOTICES.txt
asar: true
npmRebuild: false
nodeGypRebuild: false
fileAssociations:
  - ext: slabyrinth
    name: "Slabyrinth project"
    mimeType: application/x-slabyrinth+json
    role: Editor
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  # The exe's icon resource: also used by the taskbar, Start menu/desktop shortcuts, .slabyrinth
  # files ($appExe,0) and the portable exe. Generated by scripts/make-icons.ts.
  icon: build/icon.ico
nsis:
  # Explicit, so the installer and uninstaller never fall back to electron-builder's default icon.
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: "${productName}-Setup-${version}.${ext}"
portable:
  artifactName: "${productName}-${version}-portable.${ext}"
linux:
  target:
    - target: AppImage
      arch: [x64]
  category: Game
  # Icon set directory (16 … 512, named NxN.png): the AppImage's .DirIcon and desktop-entry icon.
  icon: build/icons
  executableName: slabyrinth
  # desktopName (package.json) = slabyrinth.desktop: the desktop file is slabyrinth.desktop with
  # StartupWMClass=slabyrinth, and Electron uses the same name as the window's WM_CLASS / Wayland
  # app_id, so the running window groups under the launcher icon on GNOME/KDE.
  syncDesktopName: true
  artifactName: "${productName}-${version}-${arch}.${ext}"
publish: null # CI uploads artifacts itself
