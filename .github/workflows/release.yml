name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check tag matches apps/desktop version
        shell: bash
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match apps/desktop version v${version}" >&2
            exit 1
          fi
      - name: Package
        run: npx electron-builder ${{ matrix.target }} --publish never
        working-directory: apps/desktop
      - name: Packaged smoke run (the unpacked build the installers were made from)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            xvfb-run -a npm run smoke:packaged -w @slabyrinth/desktop
          else
            npm run smoke:packaged -w @slabyrinth/desktop
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.os }}
          if-no-files-found: error
          path: |
            apps/desktop/release/Slabyrinth-*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/latest*.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Release notes = the CHANGELOG.md section for this tag (the app shows them under "What's new");
      # GitHub's generated notes only when that section is missing.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .nvmrc
            CHANGELOG.md
            apps/desktop/scripts/release-notes.ts
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Release notes from CHANGELOG.md
        id: notes
        run: node apps/desktop/scripts/release-notes.ts "${GITHUB_REF_NAME}" CHANGELOG.md release-notes.md >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**
          body_path: ${{ steps.notes.outputs.found == 'true' && 'release-notes.md' || '' }}
          generate_release_notes: ${{ steps.notes.outputs.found != 'true' }}
          prerelease: ${{ contains(github.ref_name, '-') }}
